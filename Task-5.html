<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform Animation</title>

    <style>

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .box{
            width: 150px;
            height: 150px;
            background-color: royalblue;
            color: white;
            text-align: center;
            line-height: 150px;
            font-size: 22px;
            border-radius: 10px;

            transition: transform 1s;
        }

        .box:hover{
            transform: rotate(20deg) scale(1.2) translateY(-20px);
        }

    </style>
</head>
<body>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
